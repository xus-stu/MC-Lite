[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mclite-bridge"
version = "1.3.11"
description = "Python client for the MC Lite launcher Bridge API"
requires-python = ">=3.9"
readme = "README.md"

[project.optional-dependencies]
ui = ["PySide6>=6.5"]

[tool.setuptools]
packages = ["mclite_bridge"]
