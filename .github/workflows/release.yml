name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Self-test
        run: |
          VERSION="$(cat VERSION)"
          java -jar "dist/MCLite_v${VERSION}.jar" --self-test
          java -jar "dist/MCLite_v${VERSION}-region.jar" --self-test
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MCLite_v*-region.jar
            dist/MC-Lite_v*_region_Windows.zip
            dist/MCLiteBenchmark.jar
            dist/SHA256SUMS.txt
          generate_release_notes: true
