name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # 腾讯镜像偶发限速/断流：放宽超时并配合重试，避免 tag 已推但 release 失败。
  GRADLE_OPTS: >-
    -Dorg.gradle.internal.http.connectionTimeout=120000
    -Dorg.gradle.internal.http.socketTimeout=120000

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify tag matches VERSION
        run: |
          test "v$(cat VERSION)" = "${GITHUB_REF_NAME}" || {
            echo "tag ${GITHUB_REF_NAME} 与 VERSION v$(cat VERSION) 不一致" >&2
            exit 1
          }

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Self-test
        run: |
          VERSION="$(cat VERSION)"
          java -jar "dist/MCLite_v${VERSION}.jar" --self-test
          java -jar "dist/MCLite_v${VERSION}-region.jar" --self-test
      - name: Headless regression tests
        run: |
          chmod +x test/run-ci.sh
          ./test/run-ci.sh
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-release-${{ runner.os }}-${{ hashFiles('island/gradle/wrapper/gradle-wrapper.properties', 'island/versions/26.1.2/fabric/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-release-${{ runner.os }}-
      - name: Build island mods
        run: |
          set -euo pipefail
          chmod +x island/gradlew island/versions/26.1.2/fabric/gradlew
          test -n "$JAVA_HOME_25_X64" || { echo "JAVA_HOME_25_X64 未设置" >&2; exit 1; }
          retry() {
            local attempt
            for attempt in 1 2 3; do
              if "$@"; then return 0; fi
              echo "attempt ${attempt} failed; retrying in 15s" >&2
              sleep 15
            done
            return 1
          }
          (cd island && retry ./gradlew :versions:1.20.1:fabric:bundledJar --no-daemon --stacktrace)
          (cd island/versions/26.1.2/fabric && retry env JAVA_HOME="$JAVA_HOME_25_X64" ./gradlew bundledJar --no-daemon --stacktrace -Dorg.gradle.java.home="$JAVA_HOME_25_X64")
          mkdir -p dist
          for f in island/versions/*/*/build/libs/mclite-island-*-bundled.jar; do
            cp "$f" "dist/$(basename "$f" -bundled.jar).jar"
          done
          python3 island/tools/gen_manifest.py --out dist/island-manifest.json --tag "${GITHUB_REF_NAME}" dist/mclite-island-*.jar

      - name: Prepare release notes
        run: |
          VERSION="$(cat VERSION)"
          awk -v ver="v${VERSION}" '
            index($0, "## " ver) == 1 { show = 1; next }
            show && index($0, "## ") == 1 { exit }
            show { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "本次更新：${VERSION}" > release-notes.md
          fi
          echo "----- release notes -----"
          cat release-notes.md
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MCLite_v*-region.jar
            dist/MC-Lite_v*_region_Windows.zip
            dist/MCLiteBenchmark.jar
            dist/MCLitePyBridge_v*.zip
            dist/mclite-island-*.jar
            dist/island-manifest.json
            dist/SHA256SUMS.txt
          body_path: release-notes.md
