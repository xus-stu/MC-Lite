name: island-release

# 只发模组：把 jar + manifest 覆盖到固定的 island-latest release。
# 启动器从 .../releases/download/island-latest/island-manifest.json 读取，
# 因此日常模组更新不需要再 bump 启动器版本。
on:
  workflow_dispatch:
  push:
    tags:
      - 'island-v*'

permissions:
  contents: write

concurrency:
  group: island-release
  cancel-in-progress: false

jobs:
  build-1201:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build 1.20.1
        run: |
          set -euo pipefail
          cd island
          gradle :versions:1.20.1:fabric:bundledJar --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/dist"
          for f in versions/1.20.1/fabric/build/libs/mclite-island-1.20.1-fabric-*-bundled.jar; do
            cp "$f" "$GITHUB_WORKSPACE/dist/$(basename "$f" -bundled.jar).jar"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: island-1201
          path: dist/mclite-island-1.20.1-fabric-*.jar
          if-no-files-found: error

  build-2612:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-island-2612-${{ runner.os }}-${{ hashFiles('island/versions/26.1.2/fabric/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-island-2612-${{ runner.os }}-
      - name: Build 26.1.2
        working-directory: island/versions/26.1.2/fabric
        run: |
          set -o pipefail
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew bundledJar --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-26.log; then
              mkdir -p "$GITHUB_WORKSPACE/dist"
              for f in build/libs/mclite-island-26.1.2-fabric-*-bundled.jar; do
                cp "$f" "$GITHUB_WORKSPACE/dist/$(basename "$f" -bundled.jar).jar"
              done
              exit 0
            fi
            echo "attempt ${attempt} failed; retrying in 15s" >&2
            sleep 15
          done
          {
            echo '### 26.1.2 build failed'
            echo '```'
            tail -120 /tmp/gradle-26.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: island-2612
          path: dist/mclite-island-26.1.2-fabric-*.jar
          if-no-files-found: error

  publish:
    needs: [build-1201, build-2612]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: island-*
          merge-multiple: true
          path: dist
      - name: Generate manifest
        run: |
          set -euo pipefail
          ls -l dist
          python3 island/tools/gen_manifest.py --out dist/island-manifest.json --tag island-latest dist/mclite-island-*.jar
          (cd dist && sha256sum mclite-island-*.jar island-manifest.json > SHA256SUMS.txt)
          cat dist/island-manifest.json
      - name: Publish rolling island release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: island-latest
          name: MCLite Island (latest)
          prerelease: true
          make_latest: 'false'
          files: |
            dist/mclite-island-*.jar
            dist/island-manifest.json
            dist/SHA256SUMS.txt
          body: |
            MCLite 岛最新构建，独立于启动器发布。

            启动器「下载中心 → 启动器插件」会读取这里的 `island-manifest.json`；
            该 release 标记为 prerelease，不会占用启动器的 latest release。
      - name: Mirror manifest to latest launcher release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(gh release view --json tagName --jq .tagName)"
          if [ "$latest" != "island-latest" ]; then
            echo "把最新插件清单镜像到旧启动器读取的 ${latest}"
            gh release upload "$latest" dist/island-manifest.json --clobber
          fi
      - name: Remove stale jar assets
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          keep="$(cd dist && ls mclite-island-*.jar)"
          gh release view island-latest --json assets --jq '.assets[].name' |
          while read -r name; do
            case "$name" in
              mclite-island-*)
                if ! printf '%s\n' "$keep" | grep -qx "$name"; then
                  echo "删除旧资产 $name"
                  gh release delete-asset island-latest "$name" -y
                fi
                ;;
            esac
          done
